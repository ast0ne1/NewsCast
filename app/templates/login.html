<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" data-theme-color />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{ homescreen_name or 'NewsCast' }}" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sign in · NewsCast</title>
    <script>
      (function () {
        var pref = localStorage.getItem("newscast-theme") || "system";
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = pref === "system" ? (dark ? "dark" : "light") : pref;
        var palette = localStorage.getItem("newscast-palette") || "default";
        if (!/^(default|ocean|forest|slate)$/.test(palette)) palette = "default";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePref = pref;
        document.documentElement.dataset.palette = palette;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}-{{ asset_rev }}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <header class="login-top">
        <p class="brand">{% include "_brand_mark.html" %}NewsCast</p>
      </header>
      <main class="card login-card">
        <h1>Sign in</h1>
        <p class="lede">Use your NewsCast admin username and password.</p>
        {% if error %}
        <p class="banner">{{ error }}</p>
        {% endif %}
        {% if using_factory_admin %}
        <p class="banner banner-muted">Factory login is still <strong>admin / admin</strong>.</p>
        {% endif %}
        <form method="post" action="/login" class="stack" data-native autocomplete="on">
          <input type="hidden" name="next" value="{{ next }}" />
          <label>
            Username
            <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
      </main>
    </div>
    <script src="/static/js/app.js?v={{ app_version }}-{{ asset_rev }}" defer></script>
  </body>
</html>
